<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ученичество</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=Lora:ital,wght@0,400;0,700;1,400&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0F1B2D;
      --text: #F0EBE0;
      --text-muted: #7A8BA8;
      --gold: #D4A843;
      --border: #2A3A52;
      --card-bg: rgba(42, 58, 82, 0.4);
      --card-hover: rgba(212, 168, 67, 0.1);
      --text-secondary: #D0C9BC;
    }

    :root.light {
      --bg: #F5F3EF;
      --text: #1A1A1A;
      --text-muted: #6B7280;
      --gold: #9A7B2D;
      --border: #D4CFC5;
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-hover: rgba(154, 123, 45, 0.08);
      --text-secondary: #4A4A4A;
    }

    body {
      font-family: "Montserrat", Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 60px 20px;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--border);
      border: none;
      color: var(--text-muted);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s, color 0.3s;
      z-index: 10;
    }
    .theme-toggle:hover { color: var(--gold); }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    header h1 {
      font-size: 48px;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 10px;
    }

    header p {
      font-size: 17px;
      color: var(--text-muted);
      font-weight: 300;
      font-family: "Lora", serif;
      font-style: italic;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .card {
      display: block;
      text-decoration: none;
      color: var(--text);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 28px;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: var(--gold);
      transform: translateY(-2px);
    }

    .card-icon {
      font-size: 36px;
      color: var(--gold);
      margin-bottom: 18px;
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .card-author {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 400;
    }

    .card-desc {
      font-size: 15px;
      color: var(--text-secondary);
      font-weight: 300;
      line-height: 1.5;
    }

    @media (max-width: 650px) {
      header h1 { font-size: 36px; }
      .cards { grid-template-columns: 1fr; }
      .card { padding: 28px 22px; }
      .card-title { font-size: 20px; }
      .theme-toggle { top: 12px; right: 12px; width: 36px; height: 36px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" title="Сменить тему">
    <i class="fas fa-sun"></i>
  </button>

  <div class="container">
    <header>
      <h1>Ученичество</h1>
      <p>Материалы для личного ученичества</p>
    </header>

    <div class="cards">
      <a class="card" href="burnham/">
        <div class="card-icon"><i class="fa-solid fa-book-open"></i></div>
        <div class="card-title">Преображающее знакомство со Христом</div>
        <div class="card-author">Джонатан Д. Бёрнэм</div>
        <div class="card-desc">17 тем &ndash; от Сотворения до Возвращения Царя</div>
      </a>

      <a class="card" href="7-shagov/">
        <div class="card-icon"><i class="fa-solid fa-shoe-prints"></i></div>
        <div class="card-title">Семь шагов христианской жизни</div>
        <div class="card-desc">7 уроков для христианских руководителей</div>
      </a>
    </div>
  </div>

  <script>
    const toggle = document.getElementById('themeToggle');
    const icon = toggle.querySelector('i');
    const saved = localStorage.getItem('theme');

    if (saved !== 'dark') {
      document.documentElement.classList.add('light');
      icon.classList.replace('fa-sun', 'fa-moon');
    }

    toggle.addEventListener('click', () => {
      const isLight = document.documentElement.classList.toggle('light');
      icon.classList.replace(isLight ? 'fa-sun' : 'fa-moon', isLight ? 'fa-moon' : 'fa-sun');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    });
  </script>
</body>
</html>
